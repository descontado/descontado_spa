# Lint e testes em todo Pull Request. Os mesmos comandos rodam nos hooks de .githooks/.
name: CI

on:
  pull_request:

jobs:
  ci:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
